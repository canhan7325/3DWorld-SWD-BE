spring.application.name=${APP_NAME}

# Load the local .env from the project working directory as Java properties.
spring.config.import=optional:file:./.env[.properties]

server.port=${SERVER_PORT}

# Supabase PostgreSQL session pooler.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE}

# Flyway owns schema changes; Hibernate only validates mapped entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

# Authentication
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jackson.deserialization.fail-on-unknown-properties=true
app.jwt.secret-key=${JWT_SECRET_KEY}
app.jwt.expiration=${JWT_EXPIRATION}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.project.w_3d_world.features.auth

# One-time email links and durable delivery retries.
app.auth.base-url=${APP_BASE_URL}
app.auth.token-expiration=${EMAIL_TOKEN_EXPIRATION}
app.auth.token-encryption-key=${EMAIL_TOKEN_ENCRYPTION_KEY}
app.auth.resend-cooldown-seconds=${EMAIL_RESEND_COOLDOWN}
app.mail.from=${MAIL_FROM}
app.mail.max-attempts=${MAIL_MAX_ATTEMPTS}
app.mail.poll-interval=${MAIL_POLL_INTERVAL}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
