spring.application.name=${APP_NAME}

# Load the local .env from the project working directory as Java properties.
spring.config.import=optional:file:./.env[.properties]

server.port=${SERVER_PORT}

# Supabase PostgreSQL session pooler.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE}

# Schema is managed manually; Hibernate only validates mapped entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# Schema changes are applied explicitly in Supabase SQL Editor.
# Keep Flyway disabled even when an older local .env still enables it.
spring.flyway.enabled=false

# Opt-in development fixtures, independent of Flyway. Never enabled by default.
# Authentication
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jackson.deserialization.fail-on-unknown-properties=true
app.jwt.secret-key=${JWT_SECRET_KEY}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.project.w_3d_world.features

# Cloudinary avatar uploads. Credentials are server-side only.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}


# ZaloPay sandbox
app.zalopay.app-id=${ZALOPAY_APP_ID}
app.zalopay.key1=${ZALOPAY_KEY1}
app.zalopay.key2=${ZALOPAY_KEY2}
app.zalopay.create-url=${ZALOPAY_CREATE_URL}
app.zalopay.query-url=${ZALOPAY_QUERY_URL}
app.zalopay.refund-url=${ZALOPAY_REFUND_URL}
app.zalopay.callback-url=${ZALOPAY_CALLBACK_URL:}
app.zalopay.redirect-url=${ZALOPAY_REDIRECT_URL:http://localhost:5173/payment-result}
app.payment.reconciliation-interval-ms=${PAYMENT_RECONCILIATION_INTERVAL_MS:60000}
app.order.reservation-ttl-minutes=${ORDER_RESERVATION_TTL_MINUTES:15}
app.order.reservation-scan-ms=${ORDER_RESERVATION_SCAN_MS:60000}

# One-time email links and durable delivery retries.
app.auth.base-url=${APP_BASE_URL}
app.auth.token-expiration=${EMAIL_TOKEN_EXPIRATION}
app.mail.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.servlet.multipart.max-file-size=50000000B
spring.servlet.multipart.max-request-size=51000000B

# Snapshotted on each new physical checkout; existing orders retain their values.
app.order.shipping-fee=${ORDER_SHIPPING_FEE:0}
app.order.commission-rate=${ORDER_COMMISSION_RATE:0.05}
app.order.refund-window-hours=${ORDER_REFUND_WINDOW_HOURS:72}
app.order.auto-confirm-hours=${ORDER_AUTO_CONFIRM_HOURS:24}

# Durable bounded email delivery state lives on users; no token/outbox tables.
app.auth.email-worker-enabled=${AUTH_EMAIL_WORKER_ENABLED:true}
app.auth.email-poll-ms=${AUTH_EMAIL_POLL_MS:2000}
app.auth.email-max-attempts=${AUTH_EMAIL_MAX_ATTEMPTS:5}
app.auth.email-resend-cooldown-seconds=${AUTH_EMAIL_RESEND_COOLDOWN_SECONDS:60}

# Server-side subscription price; platform_configs.STOREFRONT_MONTHLY_FEE takes precedence.
app.storefront.monthly-fee=${STOREFRONT_MONTHLY_FEE:99000}

# GHTK: fee calculation only; no shipment submission.
app.ghtk.enabled=${GHTK_ENABLED:false}
app.ghtk.token=${GHTK_TOKEN:}
app.ghtk.base-url=${GHTK_BASE_URL:https://services.giaohangtietkiem.vn}
app.ghtk.partner-code=${GHTK_PARTNER_CODE:}
app.ghtk.transport=${GHTK_TRANSPORT:road}
app.ghtk.padding-cm=${GHTK_PADDING_CM:2}
app.ghtk.quote-ttl-seconds=${GHTK_QUOTE_TTL_SECONDS:300}


# ==========================================
# MODEL STORAGE
# ==========================================
# Portable default. Override with MODEL_STORAGE_ROOT.
MODEL_STORAGE_ROOT=${user.home}/3dworld-storage/models

# ==========================================
# AI GENERATION - MESHY
# ==========================================
app.ai.meshy-api-key=${MESHY_API_KEY:}
app.ai.meshy-base-url=${MESHY_BASE_URL:https://api.meshy.ai}
app.ai.meshy-asset-hosts=${MESHY_ASSET_HOSTS:assets.meshy.ai}

# Mock must be explicitly enabled for dev/test
app.ai.mock-provider-enabled=${MOCK_PROVIDER_ENABLED:false}

# Demo top-up disabled by default
app.ai.demo-topup-enabled=${DEMO_TOPUP_ENABLED:false}

# ==========================================
# 3D MODEL CONVERSION - BLENDER
# ==========================================
# Blender executable from PATH or BLENDER_PATH
app.ai.blender-path=${BLENDER_PATH:blender}

# Enable only when Blender is installed
app.ai.conversion-enabled=${CONVERSION_ENABLED:false}
app.ai.conversion-timeout-seconds=${CONVERSION_TIMEOUT_SECONDS:60}
app.ai.conversion-max-file-size=${CONVERSION_MAX_FILE_SIZE:50000000}

# ==========================================
# ORDER CONFIGURATION - BE1
# ==========================================
app.order.cod-acceptance-ttl-minutes=${ORDER_COD_ACCEPTANCE_TTL_MINUTES:1440}

