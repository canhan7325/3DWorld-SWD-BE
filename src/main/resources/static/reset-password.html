<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Đặt lại mật khẩu · 3DWorld</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 16px/1.6 system-ui, sans-serif; background: #f3f6fb; color: #182230; }
        main { width: 100%; max-width: 460px; padding: 32px; border-radius: 16px; background: white; border: 1px solid #e2e8f0; }
        .brand { color: #2563eb; font-weight: 700; }
        h1 { font-size: 26px; margin: 12px 0; }
        p { color: #475569; overflow-wrap: anywhere; }
        label { display: block; margin-top: 16px; }
        input, button { width: 100%; padding: 12px; border-radius: 8px; font: inherit; }
        input { border: 1px solid #cbd5e1; }
        button { margin-top: 24px; border: 0; background: #2563eb; color: white; cursor: pointer; }
        button:disabled { opacity: .6; cursor: default; }
        #result { min-height: 28px; margin-bottom: 0; }
    </style>
</head>
<body>
<main>
    <span class="brand">3DWorld</span>
    <h1>Đặt lại mật khẩu</h1>
    <p>Tài khoản: <strong id="email"></strong></p>
    <form id="reset-form">
        <label for="password">Mật khẩu mới</label>
        <input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        <label for="repeat">Nhập lại mật khẩu</label>
        <input id="repeat" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        <button id="submit" type="submit">Đổi mật khẩu</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
</main>
<script>
    const params = new URLSearchParams(location.search);
    const email = params.get('email');
    const token = params.get('token');
    history.replaceState(null, '', location.pathname);
    const form = document.getElementById('reset-form');
    const button = document.getElementById('submit');
    const result = document.getElementById('result');
    document.getElementById('email').textContent = email || '';
    if (!email || !token) {
        button.disabled = true;
        result.textContent = 'Liên kết không hợp lệ. Vui lòng mở link trong email.';
    }
    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const newPassword = document.getElementById('password').value;
        if (newPassword !== document.getElementById('repeat').value) {
            result.textContent = 'Hai mật khẩu không khớp.';
            return;
        }
        if (new TextEncoder().encode(newPassword).length > 72) {
            result.textContent = 'Mật khẩu không được vượt quá 72 byte UTF-8.';
            return;
        }
        button.disabled = true;
        result.textContent = 'Đang cập nhật…';
        try {
            const response = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, token, newPassword })
            });
            const body = await response.json();
            result.textContent = body.message;
            if (response.ok) {
                form.reset();
                button.textContent = 'Đã đổi mật khẩu';
            } else button.disabled = false;
        } catch {
            result.textContent = 'Không thể kết nối tới máy chủ. Vui lòng thử lại.';
            button.disabled = false;
        }
    });
</script>
</body>
</html>
